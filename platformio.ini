; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = arduino_nano_esp32

[env:arduino_nano_esp32]
platform = espressif32
board = arduino_nano_esp32
framework = arduino
; Use ESP32 GPIO numbers in the Arduino API (config.h and the README pin
; table are written in GPIOs). Without this the core remaps 0-24 to Dx/Ax
; labels and every pin in config.h lands on the wrong pad.
build_flags = -DBOARD_USES_HW_GPIO_NUMBERS
test_filter = embedded/*
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.11
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4

; Host-native environment: runs unit tests on the development machine.
; Only hardware-independent code (src/domains) may be pulled into these tests.
[env:native]
platform = native
test_framework = unity
test_filter = native/*
test_build_src = yes
build_src_filter = +<domains/>
build_flags = -Isrc
